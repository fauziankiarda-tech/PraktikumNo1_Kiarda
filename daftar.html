
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #07845c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .kotak {
            background-color: #cce5d9;
            padding: 25px;
            width: 280px;
            max-width: 85%;
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #459d62;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #287b45;
        }

        p {
            font-size: 13px;
            text-align: center;
        }

        a {
            color: #287b45;
        }
    </style>
</head>

<body>

    <div class="kotak">
        <h2>Form Registrasi</h2>

        <form action="#" method="post">

            <input type="email"
                   name="email"
                   placeholder="Masukkan email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Masukkan password"
                   required>

            <input type="password"
                   name="konfirmasi"
                   placeholder="Masukkan ulang password"
                   required>

            <button type="submit">Daftar</button>

        </form>

        <p>Sudah punya akun?
            <a href="index.html">Login</a>
        </p>
    </div>

</body>
</html>
